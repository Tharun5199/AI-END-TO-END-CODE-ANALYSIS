[pytest]
# Only collect this project's own tests -- never test files inside repos
# that were cloned for analysis (repos/), or local stores/virtualenvs.
testpaths = tests
norecursedirs = repos vectorstore .test_vectorstore logs .venv venv .git notebook "Claude outputs"
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
